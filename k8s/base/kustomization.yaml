apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mlflow-fastapi

resources:
  - namespace.yaml
  - pvc.yaml
  - mlflow.yaml
  - train-job.yaml
  - serving.yaml

images:
  - name: mlflow-fastapi-mlflow
    newName: mlflow-fastapi-mlflow
    newTag: latest
  - name: mlflow-fastapi-train
    newName: mlflow-fastapi-train
    newTag: latest
  - name: mlflow-fastapi-serving
    newName: mlflow-fastapi-serving
    newTag: latest
